name: Split mobile guide panels into real image files
on:
  push:
    paths:
      - 'scripts/split_mobiiliohje_panels.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/split_mobiiliohje_panels.py
      - name: Commit actual split PNG files and slideshow references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/mobiiliohje mobiiliohje/index.html
          git diff --cached --quiet || (git commit -m "Create separate readable portrait images for mobile instructions" && git push)
