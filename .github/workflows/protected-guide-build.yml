name: Protected guide build
on:
  push:
    branches:
      - feature/protected-mobile-guide
    paths:
      - 'protected-guide/**'
      - '.github/workflows/protected-guide-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protected-guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        env:
          GUIDE_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run build
