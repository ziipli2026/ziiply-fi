<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tankkaus – Ziiply</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#fff4cf;color:#174c35}main{max-width:1100px;margin:auto;padding:8px 12px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{text-align:center;flex:none}#gosta{display:block;margin:8px auto 0;width:auto;max-width:min(250px,65vw);height:min(30dvh,240px);object-fit:contain}#intro{font-size:clamp(14px,2vw,18px);max-width:650px;margin:7px auto}h1{font-size:clamp(22px,3vw,34px);margin:4px 0}p{line-height:1.2;margin:6px 0}nav{display:flex;flex-direction:column;gap:12px;margin:12px auto;width:min(580px,100%)}button{border:3px solid #17573c;border-radius:22px;padding:20px 12px;background:#e3edc9;color:#174c35;font-size:clamp(15px,2vw,20px);font-weight:bold;cursor:pointer}button[aria-pressed=true]{background:#17573c;color:white}#overlay[hidden]{display:none}#overlay{position:fixed;inset:0;z-index:1000;background:rgba(23,38,29,.62);display:flex;align-items:center;justify-content:center;padding:12px}#dialog{display:flex;flex-direction:column;width:min(1180px,100%);height:min(94dvh,920px);min-height:0;background:transparent;border:0;border-radius:0;overflow:hidden;box-shadow:none}#dialogbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0;background:transparent}#dialogbar strong{display:none}#close{padding:5px 13px;border-radius:50%;background:#754322;color:white}iframe{display:block;width:100%;flex:1;min-height:0;height:100%;border:0;background:white}#status{display:none}#open{display:none}@media(max-width:700px){#overlay{padding:3px}#dialog{height:99dvh;border-radius:12px}#dialogbar{padding:5px 9px}}#status{font-size:12px;text-align:center;flex:none}#open{display:inline-block;margin:2px 0 5px;color:#174c35;font-weight:bold}@media(max-width:700px){main{padding:6px}h1{font-size:23px}nav{margin:10px auto;gap:12px}button{padding:20px 8px}#gosta{height:min(27dvh,210px)}header p{font-size:13px}iframe{min-height:0}}</style></head><body><main><header><a href="/">← Ziiply.fi</a><h1>Tankataan yhdessä halvemmalla!</h1><p id="intro">Auta Göstaa keräämään polttoainehintoja! Ota kuva hintataulusta ja auta muita löytämään edullisimmat hinnat. Hintojen katselu on aina ilmaista kaikille. Yksi kuva. Kaikkien hyöty.</p><img id="gosta" src="../images/gosta.png" alt="Gösta – Ziiplyn polttoainehintojen kerääjä"></header><nav><button id="report" aria-pressed="false">⛽ Ilmoita hinnat</button><button id="prices" aria-pressed="false">⛽ Katso hinnat</button></nav><div id="overlay" hidden><div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div id="dialogbar"><strong id="dialogtitle">Göstan polttoainevertailu</strong><button id="close" type="button" aria-label="Sulje ikkuna">×</button></div><iframe id="app" title="Ziiplyn polttoainehinnat" referrerpolicy="strict-origin-when-cross-origin" allow="geolocation; camera"></iframe></div></div></main><script>const frame=document.getElementById('app'),overlay=document.getElementById('overlay'),close=document.getElementById('close');let previousFocus=null;function dismiss(){overlay.hidden=true;frame.src='about:blank';document.getElementById('report').setAttribute('aria-pressed','false');document.getElementById('prices').setAttribute('aria-pressed','false');previousFocus?.focus()}close.onclick=dismiss;overlay.addEventListener('click',e=>{if(e.target===overlay)dismiss()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)dismiss()});function select(mode){document.getElementById('report').setAttribute('aria-pressed',String(mode==='report'));document.getElementById('prices').setAttribute('aria-pressed',String(mode==='prices'));const url='https://ziiply.vercel.app/tankkaus?mode='+encodeURIComponent(mode);previousFocus=document.activeElement;overlay.hidden=false;document.getElementById('dialogtitle').textContent=mode==='report'?'Ilmoita polttoainehintoja':'Göstan polttoainevertailu';close.focus();frame.src=url;}document.getElementById('report').onclick=()=>select('report');document.getElementById('prices').onclick=()=>select('prices');</script></body></html>
