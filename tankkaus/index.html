<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tankkaus – Ziiply</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#fff4cf;color:#174c35}main{max-width:1100px;margin:auto;padding:8px 12px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{text-align:center;flex:none}h1{font-size:clamp(22px,3vw,34px);margin:4px 0}p{line-height:1.2;margin:6px 0}nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}button{border:2px solid #17573c;border-radius:15px;padding:11px 8px;background:#e3edc9;color:#174c35;font-size:clamp(15px,2vw,20px);font-weight:bold;cursor:pointer}button[aria-pressed=true]{background:#17573c;color:white}iframe{display:block;width:100%;flex:1;min-height:0;height:auto;border:2px solid #17573c;border-radius:16px;background:white}iframe[hidden]{display:none}#status{font-size:12px;text-align:center;flex:none}#open{display:inline-block;margin:2px 0 5px;color:#174c35;font-weight:bold}@media(max-width:700px){main{padding:6px}h1{font-size:23px}nav{margin:5px 0}button{padding:10px 4px}header p{font-size:13px}iframe{min-height:0}}</style></head><body><main><header><a href="/">← Ziiply.fi</a><h1>Tankataan yhdessä halvemmalla!</h1><p>Yksi kuva. Kaikkien hyöty. Hintojen katselu on aina ilmaista.</p></header><nav><button id="report" aria-pressed="false">📷 Ilmoita hinnat</button><button id="prices" aria-pressed="false">⛽ Katso hinnat</button></nav><p id="status" role="status">Valitse toiminto.</p><a id="open" href="https://ziiply.vercel.app/tankkaus" target="_blank" rel="noopener">Avaa toiminto erilliseen ikkunaan ↗</a><iframe id="app" title="Ziiplyn polttoainehinnat" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="geolocation; camera" hidden></iframe></main><script>const frame=document.getElementById('app'),status=document.getElementById('status'),link=document.getElementById('open');function select(mode){document.getElementById('report').setAttribute('aria-pressed',String(mode==='report'));document.getElementById('prices').setAttribute('aria-pressed',String(mode==='prices'));const url='https://ziiply.vercel.app/tankkaus?mode='+encodeURIComponent(mode);frame.hidden=false;frame.src=url;link.href=url;status.textContent='Ladataan Ziiplyn '+(mode==='report'?'hintailmoitusta':'hintaselailua')+'…';frame.onload=()=>{status.textContent='Jos sisältö ei avaudu tai kamera/sijainti ei toimi upotuksessa, käytä yllä olevaa erillisen ikkunan linkkiä.'}}document.getElementById('report').onclick=()=>select('report');document.getElementById('prices').onclick=()=>select('prices');</script></body></html>
