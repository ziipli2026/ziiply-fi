<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tankkaus – Ziiply</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff4cf;color:#174c35}main{max-width:1100px;margin:auto;padding:18px 12px}header{text-align:center}h1{font-size:clamp(26px,4vw,40px);margin:14px 0 5px}p{line-height:1.4}nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}button{border:2px solid #17573c;border-radius:15px;padding:17px 8px;background:#e3edc9;color:#174c35;font-size:clamp(15px,2vw,20px);font-weight:bold;cursor:pointer}button[aria-pressed=true]{background:#17573c;color:white}iframe{width:100%;height:80dvh;min-height:520px;border:2px solid #17573c;border-radius:16px;background:white}#status{font-size:13px;text-align:center}#open{display:inline-block;margin:6px 0 12px;color:#174c35;font-weight:bold}@media(max-width:700px){main{padding:10px}h1{font-size:26px}nav{position:sticky;top:0;z-index:3;background:#fff4cf;padding:6px 0;margin:10px 0}button{padding:14px 4px}iframe{height:calc(100dvh - 245px);min-height:450px}}</style></head><body><main><header><a href="/">← Ziiply.fi</a><h1>Tankataan yhdessä halvemmalla!</h1><p>Yksi kuva. Kaikkien hyöty. Hintojen katselu on aina ilmaista.</p></header><nav><button id="report" aria-pressed="false">📷 Ilmoita hinnat</button><button id="prices" aria-pressed="false">⛽ Katso hinnat</button></nav><p id="status" role="status">Valitse toiminto.</p><a id="open" href="https://ziiply.vercel.app/tankkaus" target="_blank" rel="noopener">Avaa toiminto erilliseen ikkunaan ↗</a><iframe id="app" title="Ziiplyn polttoainehinnat" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="geolocation; camera" hidden></iframe></main><script>const frame=document.getElementById('app'),status=document.getElementById('status'),link=document.getElementById('open');function select(mode){document.getElementById('report').setAttribute('aria-pressed',String(mode==='report'));document.getElementById('prices').setAttribute('aria-pressed',String(mode==='prices'));const url='https://ziiply.vercel.app/tankkaus?mode='+encodeURIComponent(mode);frame.hidden=false;frame.src=url;link.href=url;status.textContent='Ladataan Ziiplyn '+(mode==='report'?'hintailmoitusta':'hintaselailua')+'…';frame.onload=()=>{status.textContent='Jos sisältö ei avaudu tai kamera/sijainti ei toimi upotuksessa, käytä yllä olevaa erillisen ikkunan linkkiä.'}}document.getElementById('report').onclick=()=>select('report');document.getElementById('prices').onclick=()=>select('prices');</script></body></html>
