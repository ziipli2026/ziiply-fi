<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Ziiply – mobiilikäyttöohje</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f8f3e3;color:#163e30;font-family:system-ui,-apple-system,sans-serif}header{max-width:1100px;margin:auto;padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}header>div{min-width:0}h1{font-size:clamp(21px,4vw,30px);margin:0}header p{font-size:13px;margin:4px 0 0;color:#665c47}main{max-width:1100px;margin:0 auto;padding:8px 12px 24px}.viewer{position:relative;background:#fff9e9;border:2px solid #c2a36a;border-radius:16px;overflow:hidden;height:min(72svh,760px);display:flex;align-items:center;justify-content:center}.viewer img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;cursor:zoom-in}.viewer.split img{height:100%;width:auto;max-width:none;object-fit:contain;position:absolute;top:0;left:50%;transform:translateX(-25%)}.viewer.split.right img{transform:translateX(-75%)}.viewer.zoom{overflow:auto;display:block;max-height:none}.viewer.zoom.split img{position:static;transform:none;height:auto;width:max(100%,1100px);max-width:none}.viewer.zoom img{height:auto;width:max(100%,1100px);max-width:none;cursor:zoom-out}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px}.controls button,.jump{background:#164e3b;color:white;border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}.count{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}.caption{font-size:15px;text-align:center;margin:5px 0 0;min-height:3.5em;display:flex;align-items:flex-start;justify-content:center}.jump{width:min(100%,350px);min-width:0;flex:0 1 350px;font-size:14px;background:#fff;border:1px solid #b49b6d;color:#164e3b;padding:8px}footer{font-size:12px;text-align:center;color:#756d60;padding:8px 12px 22px}@media(max-width:700px){header{flex-direction:column;align-items:stretch;gap:12px}header .jump{flex:none;align-self:center;width:min(100%,350px)}.viewer{height:clamp(300px,62svh,650px)}.controls button{padding:12px}.caption{font-size:14px}}

/* Mobiili: kuva käyttää kaiken muun käyttöliittymän jälkeen jäävän näyttötilan. */
@media(max-width:700px){
 html{height:100%}
 body{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
 header{width:100%;max-width:none;margin:0;flex:0 0 auto;padding:10px 12px 5px;gap:7px}
 h1{font-size:clamp(19px,5vw,24px);line-height:1.15}
 header p{font-size:12px;line-height:1.25;margin:3px 0 0}
 header .jump{align-self:stretch;width:100%;max-width:none;height:40px;padding:6px 10px;font-size:14px}
 main{width:100%;max-width:none;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;padding:5px 8px 0;overflow:hidden}
 .viewer{flex:1 1 auto;min-height:0;height:auto;max-height:none;width:100%;border-radius:12px}
 .viewer img{height:100%;max-height:100%;max-width:100%;width:auto;object-fit:contain}
 .viewer.zoom{flex:1 1 auto;min-height:0;max-height:none;overflow:auto}
 .viewer.zoom img{height:auto;max-height:none;width:max(100%,1100px);max-width:none}
 main>div[style*="text-align:center"]{flex:0 0 auto;padding:5px!important}
 #zoom{padding:7px 13px!important;font-size:13px}
 .controls{flex:0 0 auto;padding:5px 2px;gap:6px}
 .controls button{padding:10px 8px;font-size:clamp(12px,3.6vw,16px);white-space:nowrap}
 .count{font-size:14px;white-space:nowrap}
 .caption{flex:0 0 auto;min-height:0;max-height:2.5em;overflow:hidden;font-size:12px;line-height:1.25;margin:3px 0 5px;display:block;text-align:center}
 footer{flex:0 0 auto;padding:3px 8px max(5px,env(safe-area-inset-bottom));font-size:10px;line-height:1.2}
}
@media(max-width:700px) and (max-height:650px){
 header p{display:none}
 header{padding-top:5px;gap:4px}
 header .jump{height:34px}
 .controls button{padding:7px 8px}
 footer{font-size:9px}
}

/* Kahden palstan ohjekuvat näytetään yksi palsta kerrallaan. */
.viewer.split{overflow:hidden}
.viewer.split img{position:absolute;top:50%;left:0;width:200%;height:auto;max-width:none;max-height:none;object-fit:fill;transform:translateY(-50%)}
.viewer.split.right img{left:-100%;transform:translateY(-50%)}
.viewer.zoom.split{overflow:auto;display:block}
.viewer.zoom.split img,.viewer.zoom.split.right img{position:static;top:auto;left:auto;transform:none;width:max(200%,1100px);height:auto;max-width:none;max-height:none}

/* Puolikas täyttää mobiilikehyksen korkeuden; näytä vain valittu palsta. */
.viewer.split{overflow:hidden}
.viewer.split img{position:absolute!important;top:50%!important;left:50%!important;width:auto!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:fill!important;transform:translate(-25%,-50%)!important}
.viewer.split.right img{transform:translate(-75%,-50%)!important}
.viewer.zoom.split{overflow:auto}
.viewer.zoom.split img,.viewer.zoom.split.right img{position:static!important;top:auto!important;left:auto!important;transform:none!important;width:auto!important;height:auto!important;min-height:100%!important;max-width:none!important;max-height:none!important}


.slide-description{margin:0 auto 8px;padding:8px 14px;max-width:850px;font-size:15px;line-height:1.35;text-align:center;color:#214e40;background:#eef5e9;border-radius:10px}@media(max-width:700px){.slide-description{flex:0 0 auto;font-size:12px;line-height:1.25;padding:5px 9px;margin:0 0 4px;max-height:4.2em;overflow:auto}.caption{margin-bottom:2px}}

/* Sama tila kolmelle seliteriville kaikissa dioissa. */
.slide-description{box-sizing:content-box;height:4.05em;min-height:4.05em;max-height:4.05em;line-height:1.35;white-space:pre-line;overflow:auto}
.caption{height:2.5em;min-height:2.5em;max-height:2.5em;overflow:auto}
@media(max-width:700px){
 .slide-description{flex:0 0 auto;height:3.75em;min-height:3.75em;max-height:3.75em;line-height:1.25}
 .caption{flex:0 0 auto;height:2.5em;min-height:2.5em;max-height:2.5em}
}
</style></head><body><header><div><h1>Ziiplyn mobiilikäyttöohje</h1><p>Selaa ohjekuvia järjestyksessä. Voit myös valita aiheen.</p></div><select class="jump" id="jump" aria-label="Valitse ohje"></select></header><main><div class="viewer" id="viewer"><img id="picture" alt="" decoding="async"></div><div style="text-align:center;padding:8px"><button id="zoom" type="button" style="border:1px solid #b49b6d;border-radius:8px;background:white;padding:9px 15px;color:#164e3b">Suurenna kuva</button></div><div class="controls"><button id="prev" type="button">← Edellinen</button><div class="count" id="count" aria-live="polite"></div><button id="next" type="button">Seuraava →</button></div><p class="caption" id="caption"></p><p class="slide-description" id="slideDescription"></p></main><footer>Ohje on tarkoitettu Ziiplyn mobiilitestaajille. Ohjekuvat näytetään yksi dia kerrallaan.</footer><script>
const slides=[{"src":"/images/mobiiliohje/Kolme hahmoa.png","title":"Kolme hahmoa – Gösta, Justiina ja Arvo","description":"Valitse pääsivulta Gösta, Justiina tai Arvo.\nNapauta haluamasi hahmon kuvapainiketta.\nJokaisella hahmolla on oma tehtävänsä."},{"src":"/images/mobiiliohje/Kolme_hahmoa_selitteet.png","title":"Kolme hahmoa – toimintojen selitteet","description":"Gösta auttaa tarjouksissa ja hinnoissa.\nJustiina auttaa tuotteissa ja resepteissä.\nArvossa ovat asetukset ja ravintoseuranta."},{"src":"/images/mobiiliohje/ohje_top.png","title":"Yläpalkki – sää, sähkö, polttoaine ja kalenteri","description":"Sää näyttää säätilan ja lämpötilan.\nSähkö ja Ajoaine näyttävät hintatietoja.\nVihreästä nuolesta avaat kalenterin."},{"src":"/images/mobiiliohje/ohje_electric.png","title":"Sähkö – tarkastele hintakehitystä","description":"Paina yläpalkin Sähkö-ruutua.\nKatso hintakehitys sekä alin ja ylin hinta.\nSulje rastista. Kuvan hinnat ovat esimerkkejä."},{"src":"/images/mobiiliohje/ohje_calendar.jpeg","title":"Kalenteri – avaa puhelimen kalenteri","description":"Paina Kalenteri-ruudun vihreää nuolta.\nPuhelimen oma kalenteri avautuu.\nPalaa Ziiplyyn vaihtamalla selaimeen."},{"src":"/images/mobiiliohje/nappi_PA.png?v=75655e72","title":"Polttoaine – katso tai ilmoita hinnat","description":"Paina yläpalkin Ajoaine-ruutua.\nNäytä hinnat avaa asemien valinnan.\nIlmoita hinnat avaa hintojen ilmoittamisen."},{"src":"/images/mobiiliohje/ohje_fuel-stations.png","title":"Polttoaine – valitse ensin asemat","description":"Valitse liikenneasemat tai kylmäasemat / muut.\nValitse haluamasi asemat valintamerkeistä.\nPaina sitten alapalkin Göstan Vertaa-nappia."},{"src":"/images/mobiiliohje/ohje_fuel-compare.png","title":"Polttoaine – järjestä vertailu","description":"Valitse asemat ja paina Göstan Vertaa-nappia.\nJärjestä etäisyyden, dieselin tai 95:n mukaan.\nKatso havainnon aika; viiva = ei hintaa."},{"src":"/images/mobiiliohje/ohje_fuel-report.png","title":"Polttoaine – kolme tapaa ilmoittaa hinnat","description":"Avaa Ajoaine ja valitse Ilmoita hinnat.\nKuvaa hintataulu tai valitse aiempi kuva.\nVoit myös syöttää hinnat käsin ilman kuvaa."},{"src":"/images/mobiiliohje/ohje_location.png","title":"Sijainti – GPS tai paikkakunta","description":"Vihreä sijaintipainike: oma GPS käytössä.\nKirjoita paikka: GPS pois, painike punainen.\nPalauta GPS sijaintipainikkeesta."},{"src":"/images/mobiiliohje/ohje_map.png","title":"Kartta – valitut kaupat ja reitti","description":"Avaa kartta kompassipainikkeesta.\nValitse kaupan Näytä reitti -painike.\nOma sijainti on mukana, kun GPS on käytössä."},{"src":"/images/mobiiliohje/ohje_nav.png","title":"Alapalkki – Kaupat, Hae, Kori ja Vertailu","description":"Kaupat: valitse kaupat. Hae: etsi tuotteita.\nKori: tarkista tuotteet. Vertailu: vertaa hinnat.\nPolttoainehaussa Hae vaihtuu Vertaa-napiksi."},{"src":"/images/mobiiliohje/haku_yksi_monta.png","title":"Yksi tai Monta – valitse kaupat ja hae","description":"Valitse ensin Yksi tai Monta.\nValitse haluamasi kauppa tai kaupat.\nPaina lopuksi alapalkin Hae-painiketta."},{"src":"/images/mobiiliohje/tarjoushaku1.png","title":"Göstan tarjoukset – pääsivulta","description":"Avaa tarjoushaku pääsivulta.\nPaina Gösta-laatikon yläosan kuvapainiketta.\nValitse sitten haluamasi kaupparyhmä."},{"src":"/images/mobiiliohje/tarjoushaku2.png","title":"Göstan tarjoukset – Hae-välilehdeltä","description":"Avaa alapalkin Hae-välilehti.\nPaina Göstan kuvapainiketta.\nSama tarjoushaku avautuu myös tätä kautta."},{"src":"/images/mobiiliohje/tarjoushaku3.png","title":"Tarjoushaku – valitse kaupparyhmä","description":"Valitse haluamasi kaupparyhmä.\nVaihtoehdot: S-ryhmä, K-ryhmä, Tokmanni ja Lidl.\nJatka valitsemasi kaupan tarjouksiin."},{"src":"/images/mobiiliohje/hakumuodot.png","title":"Tarjoushaun välilehdet","description":"Lidl ja Spar–Tokmanni: Tarjoukset-välilehti.\nS- ja K-ryhmän lähi- ja tavaratalokaupat:\nTarjoukset- ja Kampanjat-välilehdet."},{"src":"/images/mobiiliohje/tarjous_haku.png","title":"Tarjoukset – valitse tuoteryhmä","description":"Avaa Tarjoukset-välilehti.\nValitse tuoteryhmä, esimerkiksi Maitotuotteet.\nNäet valitsemasi tuoteryhmän tarjoukset."},{"src":"/images/mobiiliohje/kampanjahaku.png","title":"Kampanjat – valitse tuoteryhmä","description":"Avaa Kampanjat-välilehti.\nValitse tuoteryhmä, esimerkiksi Kahvi & tee.\nNäet tuoteryhmän kampanjatuotteet."},{"src":"/images/mobiiliohje/halpuusvertailu1.jpeg?v=2","title":"Halpuusvertailu – valitse vähintään kaksi kauppaa","description":"Valitse ensin Monta ja vähintään kaksi kauppaa.\nLisää vertailtavat tuotteet ostoskoriin.\nAvaa kori ja paina Halpuusvertailu."},{"src":"/images/mobiiliohje/halpuusvertailu2.jpeg?v=2","title":"Halpuusvertailu – vertaile korien loppusummat","description":"Näet korin yhteishinnan valituissa kaupoissa.\nParas hinta erottuu vihreällä; näet hintaeron.\nAvaa kaupan tuotteet Muuta valintoja -napista."},{"src":"/images/mobiiliohje/halpuusvertailu3.jpeg?v=2","title":"Halpuusvertailu – muuta tuotevalintoja","description":"Näet kaupan tuotteet, määrät ja rivihinnat.\nValitse halvin, kaupan merkki tai tuotemerkki.\nTarkista muutosten jälkeen korin loppusumma."},{"src":"/images/mobiiliohje/halpuusvertailu4.jpeg?v=2","title":"Halpuusvertailu – tarkista toinen kauppa","description":"Palaa nuolesta kauppojen yhteenvetoon.\nAvaa myös toisen kaupan Muuta valintoja.\nVertaa tuotteita, valintoja ja yhteishintaa."},{"src":"/images/mobiiliohje/kori3.png","title":"Ostoskorin rakentaminen – kirjoita tai puhu","description":"Valitse ensin kaupat ja avaa Hae.\nKirjoita tuote, tuoteryhmä tai ostoslista.\nVoit myös painaa Äänitä ja sanoa hakusi."},{"src":"/images/mobiiliohje/kori2.png","title":"Ostoskorin rakentaminen – kamera ja EAN","description":"Avaa skanneri Filmaa-painikkeesta.\nKohdista kamera tuotteen viivakoodiin.\nLiitä EAN -napista voit antaa numerot käsin."},{"src":"/images/mobiiliohje/kori1.png","title":"Ostoskorin rakentaminen – Bluetooth-sormiskanneri","description":"Yhdistä Bluetooth-sormiskanneri puhelimeen.\nKäytä HID-näppäimistötilaa ja lue viivakoodi.\nEnsimmäinen kuittaa, seuraava lisää määrää."},{"src":"/images/mobiiliohje/kori4.png","title":"Valitse tuote – lisää koriin","description":"Avaa haun löytöluettelo.\nValitse tuote ja paina Lisää koriin.\nJatka muiden tuotteiden hakua ja lisäämistä."},{"src":"/images/mobiiliohje/kori5.png","title":"Avaa ostoskori ja vertaile hinnat","description":"Avaa alapalkin Kori-painike.\nTarkista koriin lisätyt tuotteet ja määrät.\nPaina Halpuusvertailu vertaillaksesi hintoja."},{"src":"/images/resepti1.png","title":"Justiinan reseptit – avaa pääsivulta","description":"Avaa pääsivun Justiina-laatikko.\nPaina alaosan Reseptit-painiketta.\nJustiinan reseptinäkymä avautuu."},{"src":"/images/resepti2.png","title":"Justiinan reseptit – kuvaa tai hae omista","description":"Lisää resepti kuvasta painamalla Filmaa.\nVoit kuvata reseptin tai liittää valmiin kuvan.\nHae omista -kenttä etsii tallennetut reseptit."},{"src":"/images/resepti3.png","title":"Kuvaa resepti tai liitä reseptikuva","description":"Kohdista kamera paperin tai kirjan reseptiin.\nPaina Ota kuva, kun resepti näkyy selkeästi.\nLiitä kuva -napista valitset valmiin kuvan."},{"src":"/images/mobiiliohje/arvon_ravintoskanneri.png","title":"Arvon ravintoskanneri","description":"Skannaa tuotteen viivakoodi Arvossa.\nSäädä syömäsi annoksen määrä.\nTarkista ravintoarvot ja kirjaa annos aterialle."},{"src":"/images/mobiiliohje/arvo_ohje.png","title":"Arvon asetukset ja seuranta","description":"Avaa Arvon asetukset ja seuranta.\nHallitse omia asetuksiasi.\nTarkastele ravintotietoja ja tilastoja."},{"src":"/images/mobiiliohje/gostan_tarjousvahti.png","title":"Göstan tarjousvahti","description":"Avaa Göstan tarjousvahti.\nValitse sinua kiinnostavat tarjoukset.\nSeuraa niitä tarjousvahdin avulla."}];let index=0;const picture=document.getElementById('picture'),jump=document.getElementById('jump');slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.title;jump.append(o)});function show(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];picture.src=encodeURI(s.src);picture.alt=s.title;document.getElementById('caption').textContent=s.title;document.getElementById('slideDescription').textContent=s.description||'';document.getElementById('count').textContent=(index+1)+' / '+slides.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;jump.value=index;document.getElementById('viewer').classList.remove('zoom','split','right');if(s.half){document.getElementById('viewer').classList.add('split');if(s.half==='right')document.getElementById('viewer').classList.add('right');}document.getElementById('zoom').textContent='Suurenna kuva';}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);jump.onchange=()=>show(Number(jump.value));let startX=null;picture.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});picture.addEventListener('touchend',e=>{if(startX===null)return;const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>65)show(index+(d<0?1:-1));startX=null},{passive:true});document.getElementById('zoom').onclick=()=>{const z=document.getElementById('viewer').classList.toggle('zoom');document.getElementById('zoom').textContent=z?'Pienennä kuva':'Suurenna kuva'};picture.onclick=()=>document.getElementById('zoom').click();show(0);
</script></body></html>
