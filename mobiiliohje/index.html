<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Ziiply – mobiilikäyttöohje</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f8f3e3;color:#163e30;font-family:system-ui,-apple-system,sans-serif}header{max-width:1100px;margin:auto;padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}header>div{min-width:0}h1{font-size:clamp(21px,4vw,30px);margin:0}header p{font-size:13px;margin:4px 0 0;color:#665c47}main{max-width:1100px;margin:0 auto;padding:8px 12px 24px}.viewer{position:relative;background:#fff9e9;border:2px solid #c2a36a;border-radius:16px;overflow:hidden;height:min(72svh,760px);display:flex;align-items:center;justify-content:center}.viewer img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;cursor:zoom-in}.viewer.split img{height:100%;width:auto;max-width:none;object-fit:contain;position:absolute;top:0;left:50%;transform:translateX(-25%)}.viewer.split.right img{transform:translateX(-75%)}.viewer.zoom{overflow:auto;display:block;max-height:none}.viewer.zoom.split img{position:static;transform:none;height:auto;width:max(100%,1100px);max-width:none}.viewer.zoom img{height:auto;width:max(100%,1100px);max-width:none;cursor:zoom-out}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px}.controls button,.jump{background:#164e3b;color:white;border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}.count{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}.caption{font-size:15px;text-align:center;margin:5px 0 0;min-height:3.5em;display:flex;align-items:flex-start;justify-content:center}.jump{width:min(100%,350px);min-width:0;flex:0 1 350px;font-size:14px;background:#fff;border:1px solid #b49b6d;color:#164e3b;padding:8px}footer{font-size:12px;text-align:center;color:#756d60;padding:8px 12px 22px}@media(max-width:700px){header{flex-direction:column;align-items:stretch;gap:12px}header .jump{flex:none;align-self:center;width:min(100%,350px)}.viewer{height:clamp(300px,62svh,650px)}.controls button{padding:12px}.caption{font-size:14px}}

/* Mobiili: kuva käyttää kaiken muun käyttöliittymän jälkeen jäävän näyttötilan. */
@media(max-width:700px){
 html{height:100%}
 body{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
 header{width:100%;max-width:none;margin:0;flex:0 0 auto;padding:10px 12px 5px;gap:7px}
 h1{font-size:clamp(19px,5vw,24px);line-height:1.15}
 header p{font-size:12px;line-height:1.25;margin:3px 0 0}
 header .jump{align-self:stretch;width:100%;max-width:none;height:40px;padding:6px 10px;font-size:14px}
 main{width:100%;max-width:none;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;padding:5px 8px 0;overflow:hidden}
 .viewer{flex:1 1 auto;min-height:0;height:auto;max-height:none;width:100%;border-radius:12px}
 .viewer img{height:100%;max-height:100%;max-width:100%;width:auto;object-fit:contain}
 .viewer.zoom{flex:1 1 auto;min-height:0;max-height:none;overflow:auto}
 .viewer.zoom img{height:auto;max-height:none;width:max(100%,1100px);max-width:none}
 main>div[style*="text-align:center"]{flex:0 0 auto;padding:5px!important}
 #zoom{padding:7px 13px!important;font-size:13px}
 .controls{flex:0 0 auto;padding:5px 2px;gap:6px}
 .controls button{padding:10px 8px;font-size:clamp(12px,3.6vw,16px);white-space:nowrap}
 .count{font-size:14px;white-space:nowrap}
 .caption{flex:0 0 auto;min-height:0;max-height:2.5em;overflow:hidden;font-size:12px;line-height:1.25;margin:3px 0 5px;display:block;text-align:center}
 footer{flex:0 0 auto;padding:3px 8px max(5px,env(safe-area-inset-bottom));font-size:10px;line-height:1.2}
}
@media(max-width:700px) and (max-height:650px){
 header p{display:none}
 header{padding-top:5px;gap:4px}
 header .jump{height:34px}
 .controls button{padding:7px 8px}
 footer{font-size:9px}
}

/* Kahden palstan ohjekuvat näytetään yksi palsta kerrallaan. */
.viewer.split{overflow:hidden}
.viewer.split img{position:absolute;top:50%;left:0;width:200%;height:auto;max-width:none;max-height:none;object-fit:fill;transform:translateY(-50%)}
.viewer.split.right img{left:-100%;transform:translateY(-50%)}
.viewer.zoom.split{overflow:auto;display:block}
.viewer.zoom.split img,.viewer.zoom.split.right img{position:static;top:auto;left:auto;transform:none;width:max(200%,1100px);height:auto;max-width:none;max-height:none}

/* Puolikas täyttää mobiilikehyksen korkeuden; näytä vain valittu palsta. */
.viewer.split{overflow:hidden}
.viewer.split img{position:absolute!important;top:50%!important;left:50%!important;width:auto!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:fill!important;transform:translate(-25%,-50%)!important}
.viewer.split.right img{transform:translate(-75%,-50%)!important}
.viewer.zoom.split{overflow:auto}
.viewer.zoom.split img,.viewer.zoom.split.right img{position:static!important;top:auto!important;left:auto!important;transform:none!important;width:auto!important;height:auto!important;min-height:100%!important;max-width:none!important;max-height:none!important}


.slide-description{margin:0 auto 8px;padding:8px 14px;max-width:850px;font-size:15px;line-height:1.35;text-align:center;color:#214e40;background:#eef5e9;border-radius:10px}@media(max-width:700px){.slide-description{flex:0 0 auto;font-size:12px;line-height:1.25;padding:5px 9px;margin:0 0 4px;max-height:4.2em;overflow:auto}.caption{margin-bottom:2px}}
</style></head><body><header><div><h1>Ziiplyn mobiilikäyttöohje</h1><p>Selaa ohjekuvia järjestyksessä. Voit myös valita aiheen.</p></div><select class="jump" id="jump" aria-label="Valitse ohje"></select></header><main><div class="viewer" id="viewer"><img id="picture" alt="" decoding="async"></div><div style="text-align:center;padding:8px"><button id="zoom" type="button" style="border:1px solid #b49b6d;border-radius:8px;background:white;padding:9px 15px;color:#164e3b">Suurenna kuva</button></div><div class="controls"><button id="prev" type="button">← Edellinen</button><div class="count" id="count" aria-live="polite"></div><button id="next" type="button">Seuraava →</button></div><p class="caption" id="caption"></p><p class="slide-description" id="slideDescription"></p></main><footer>Ohje on tarkoitettu Ziiplyn mobiilitestaajille. Ohjekuvat näytetään yksi dia kerrallaan.</footer><script>
const slides=[{"src":"/images/mobiiliohje/Kolme hahmoa.png","title":"Kolme hahmoa – Gösta, Justiina ja Arvo","description":"Valitse Gösta, Justiina tai Arvo napauttamalla hahmoa. Jokaisella on oma tehtävänsä."},{"src":"/images/mobiiliohje/Kolme_hahmoa_selitteet.png","title":"Kolme hahmoa – toimintojen selitteet","description":"Gösta auttaa tarjouksissa ja hinnoissa, Justiina resepteissä ja Arvo asetuksissa sekä hyvinvoinnin seurannassa."},{"src":"/images/mobiiliohje/ohje_top.png","title":"Yläpalkki – sää, sähkö, polttoaine ja kalenteri","description":"Sää näyttää lämpötilan ja säätilan. Sähkö näyttää pörssisähkön hinnan. Ajoaine näyttää lähimmän hintatiedollisen aseman ja polttoainehinnat. Kalenterin nuolesta avaat kalenterin."},{"src":"/images/mobiiliohje/ohje_electric.png","title":"Sähkö – tarkastele hintakehitystä","description":"Paina yläpalkin Sähkö-ruutua. Näet sähkön hintakuvaajan sekä halvimman ja kalleimman hinnan. Sulje ikkuna oikean yläkulman rastista. Kuvan hinnat ovat esimerkkejä."},{"src":"/images/mobiiliohje/ohje_calendar.jpeg","title":"Kalenteri – avaa puhelimen kalenteri","description":"Paina yläpalkin Kalenteri-ruudun vihreää nuolta. Puhelimen kalenteri avautuu, ja palaat Ziiplyyn vaihtamalla takaisin selaimeen."},{"src":"/images/mobiiliohje/ohje_fuel-menu.png","title":"Polttoaine – katso tai ilmoita hinnat","description":"Paina yläpalkin Ajoaine-ruutua. Näytä hinnat avaa ensin asemien valinnan. Ilmoita hinnat -painikkeesta voit lisätä oman hintahavaintosi."},{"src":"/images/mobiiliohje/ohje_fuel-report.png","title":"Polttoaine – kolme tapaa ilmoittaa hinnat","description":"Ota kuva online: kuvaa aseman hintataulu. Lisää kuva offline: valitse aiemmin ottamasi kuva. Syötä käsin: anna hinnat ilman kuvaa."},{"src":"/images/mobiiliohje/ohje_fuel-stations.png","title":"Polttoaine – valitse ensin asemat","description":"Valitse ensin Liikenneasemat tai Kylmäasemat / muut ja haluamasi asemat asemakorttien valintamerkeistä. Paina vasta sen jälkeen alapalkin Göstan kuvalla merkittyä Vertaa-painiketta."},{"src":"/images/mobiiliohje/ohje_fuel-compare.png","title":"Polttoaine – järjestä vertailu","description":"Kun olet valinnut asemat ja painanut alapalkin Göstan Vertaa-painiketta, hintavertailu avautuu. Järjestä tulokset: Lähimmät, Halvin diesel tai Halvin bensa 95. Tarkista hintahavainnon ajankohta; viiva tarkoittaa puuttuvaa hintaa."},{"src":"/images/mobiiliohje/ohje_location.png","title":"Sijainti – GPS tai paikkakunta","description":"Vihreä sijaintipainike tarkoittaa oman sijainnin käyttöä. Kirjoita paikkakunta tai postinumero hakeaksesi muualta; GPS kytkeytyy pois ja painike muuttuu punaiseksi. Palaa omaan sijaintiin sijaintipainikkeesta."},{"src":"/images/mobiiliohje/ohje_map.png","title":"Kartta – valitut kaupat ja reitti","description":"Avaa kartta sijaintipalkin kompassipainikkeesta. Näet valitut kaupat kartalla. Paina kaupan Näytä reitti -painiketta avataksesi reitin; oma sijainti on mukana, kun GPS on käytössä."},{"src":"/images/mobiiliohje/ohje_nav.png","title":"Alapalkki – Kaupat, Hae, Kori ja Vertailu","description":"Kaupat: valitse kaupat. Hae: etsi tuotteita. Kori: tarkista lisäämäsi tuotteet ja määrät. Vertailu: vertaile korin hintoja. Polttoainenäkymässä Hae-painikkeen tilalla näkyy Vertaa."},{"src":"/images/mobiiliohje/haku_yksi_monta.png","title":"Yksi tai Monta – valitse kaupat ja hae","description":"Valitse ensin Yksi tai Monta, sitten haluamasi kauppa tai kaupat. Paina lopuksi alapalkin Hae-painiketta."},{"src":"/images/mobiiliohje/tarjoushaku1.png","title":"Göstan tarjoukset – pääsivulta","description":"Avaa tarjoushaku painamalla pääsivulla Gösta-laatikon yläosan kuvapainiketta. Voit katsella haluamiesi kauppojen tarjouksia."},{"src":"/images/mobiiliohje/tarjoushaku2.png","title":"Göstan tarjoukset – Hae-välilehdeltä","description":"Voit avata saman tarjoushaun myös Hae-välilehdeltä painamalla Göstan kuvaa."},{"src":"/images/mobiiliohje/tarjoushaku3.png","title":"Tarjoushaku – valitse kaupparyhmä","description":"Valitse kaupparyhmä, jonka tarjouksia haluat katsella: S-ryhmä, K-ryhmä, Tokmanni tai Lidl."},{"src":"/images/mobiiliohje/hakumuodot.png","title":"Tarjoushaun välilehdet","description":"Lidlissä ja Spar–Tokmannilla on Tarjoukset-välilehti. S- ja K-ryhmän tavarataloissa ja lähikaupoissa on sekä Tarjoukset- että Kampanjat-välilehti."},{"src":"/images/mobiiliohje/tarjous_haku.png","title":"Tarjoukset – valitse tuoteryhmä","description":"Avaa Tarjoukset-välilehti ja paina haluamaasi tuoteryhmää, esimerkiksi Maitotuotteet. Näet kyseisen tuoteryhmän tarjoukset."},{"src":"/images/mobiiliohje/kampanjahaku.png","title":"Kampanjat – valitse tuoteryhmä","description":"Avaa Kampanjat-välilehti ja paina haluamaasi tuoteryhmää, esimerkiksi Kahvi & tee. Näet kyseisen tuoteryhmän kampanjatuotteet."},{"src":"/images/mobiiliohje/kori3.png","title":"Ostoskorin rakentaminen – kirjoita tai puhu","description":"Valitse ensin kaupat. Rakenna samaa ostoskoria kotona tai kaupassa: kirjoita Hae-välilehdellä tuote, tuoteryhmä tai ostoslista, tai paina Äänitä ja sano, mitä etsit."},{"src":"/images/mobiiliohje/kori2.png","title":"Ostoskorin rakentaminen – kamera ja EAN","description":"Avaa skanneri Filmaa-painikkeesta ja kohdista kamera tuotteen viivakoodiin. Liitä EAN -painikkeella voit antaa viivakoodin numerot käsin."},{"src":"/images/mobiiliohje/kori1.png","title":"Ostoskorin rakentaminen – Bluetooth-sormiskanneri","description":"Voit käyttää myös Bluetooth-sormiskanneria. Yhdistä se puhelimeen HID-näppäimistönä ja skannaa tuotteen viivakoodi. Ensimmäinen skannaus kuittaa tuotteen, seuraava kasvattaa määrää."},{"src":"/images/mobiiliohje/kori4.png","title":"Valitse tuote – lisää koriin","description":"Avaa haun löytöluettelo, valitse haluamasi tuote ja paina Lisää koriin. Voit jatkaa muiden tuotteiden hakemista ja lisäämistä."},{"src":"/images/mobiiliohje/kori5.png","title":"Avaa ostoskori ja vertaile hinnat","description":"Paina alapalkin Kori-painiketta ja tarkista tuotteet sekä määrät. Siirry hintavertailuun Halpuusvertailu-painikkeesta."},{"src":"/images/resepti1.png","title":"Justiinan reseptit – avaa pääsivulta","description":"Avaa reseptit painamalla pääsivulla Justiinan laatikon alaosan Reseptit-painiketta."},{"src":"/images/resepti2.png","title":"Justiinan reseptit – kuvaa tai hae omista","description":"Paina Filmaa, kun haluat lisätä reseptin kuvasta. Hae reseptiä omista -kentällä löydät aiemmin tallentamasi reseptit."},{"src":"/images/resepti3.png","title":"Kuvaa resepti tai liitä reseptikuva","description":"Kohdista kamera paperilla tai kirjassa olevaan reseptiin ja paina Ota kuva. Voit myös valita valmiin reseptikuvan Liitä kuva -painikkeesta."},{"src":"/images/mobiiliohje/arvon_ravintoskanneri.png","title":"Arvon ravintoskanneri","description":"Skannaa tuotteen viivakoodi ja kirjaa syömäsi annos Arvon ravintoseurantaan."},{"src":"/images/mobiiliohje/arvo_ohje.png","title":"Arvon asetukset ja seuranta","description":"Arvossa hallitset omia asetuksia ja tarkastelet ravintotietoja sekä tilastoja."},{"src":"/images/mobiiliohje/gostan_tarjousvahti.png","title":"Göstan tarjousvahti","description":"Göstan tarjousvahdilla voit seurata kiinnostavia tarjouksia."}];let index=0;const picture=document.getElementById('picture'),jump=document.getElementById('jump');slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.title;jump.append(o)});function show(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];picture.src=encodeURI(s.src);picture.alt=s.title;document.getElementById('caption').textContent=s.title;document.getElementById('slideDescription').textContent=s.description||'';document.getElementById('count').textContent=(index+1)+' / '+slides.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;jump.value=index;document.getElementById('viewer').classList.remove('zoom','split','right');if(s.half){document.getElementById('viewer').classList.add('split');if(s.half==='right')document.getElementById('viewer').classList.add('right');}document.getElementById('zoom').textContent='Suurenna kuva';}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);jump.onchange=()=>show(Number(jump.value));let startX=null;picture.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});picture.addEventListener('touchend',e=>{if(startX===null)return;const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>65)show(index+(d<0?1:-1));startX=null},{passive:true});document.getElementById('zoom').onclick=()=>{const z=document.getElementById('viewer').classList.toggle('zoom');document.getElementById('zoom').textContent=z?'Pienennä kuva':'Suurenna kuva'};picture.onclick=()=>document.getElementById('zoom').click();show(0);
</script></body></html>
