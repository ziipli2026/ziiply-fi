<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Ziiply – mobiilikäyttöohje</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f8f3e3;color:#163e30;font-family:system-ui,-apple-system,sans-serif}header{max-width:1100px;margin:auto;padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}header>div{min-width:0}h1{font-size:clamp(21px,4vw,30px);margin:0}header p{font-size:13px;margin:4px 0 0;color:#665c47}main{max-width:1100px;margin:0 auto;padding:8px 12px 24px}.viewer{position:relative;background:#fff9e9;border:2px solid #c2a36a;border-radius:16px;overflow:hidden;height:min(72svh,760px);display:flex;align-items:center;justify-content:center}.viewer img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;cursor:zoom-in}.viewer.split img{height:100%;width:auto;max-width:none;object-fit:contain;position:absolute;top:0;left:50%;transform:translateX(-25%)}.viewer.split.right img{transform:translateX(-75%)}.viewer.zoom{overflow:auto;display:block;max-height:none}.viewer.zoom.split img{position:static;transform:none;height:auto;width:max(100%,1100px);max-width:none}.viewer.zoom img{height:auto;width:max(100%,1100px);max-width:none;cursor:zoom-out}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px}.controls button,.jump{background:#164e3b;color:white;border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}.count{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}.caption{font-size:15px;text-align:center;margin:5px 0 0;min-height:3.5em;display:flex;align-items:flex-start;justify-content:center}.jump{width:min(100%,350px);min-width:0;flex:0 1 350px;font-size:14px;background:#fff;border:1px solid #b49b6d;color:#164e3b;padding:8px}footer{font-size:12px;text-align:center;color:#756d60;padding:8px 12px 22px}@media(max-width:700px){header{flex-direction:column;align-items:stretch;gap:12px}header .jump{flex:none;align-self:center;width:min(100%,350px)}.viewer{height:clamp(300px,62svh,650px)}.controls button{padding:12px}.caption{font-size:14px}}
</style></head><body><header><div><h1>Ziiplyn mobiilikäyttöohje</h1><p>Selaa ohjekuvia järjestyksessä. Voit myös valita aiheen.</p></div><select class="jump" id="jump" aria-label="Valitse ohje"></select></header><main><div class="viewer" id="viewer"><img id="picture" alt="" decoding="async"></div><div style="text-align:center;padding:8px"><button id="zoom" type="button" style="border:1px solid #b49b6d;border-radius:8px;background:white;padding:9px 15px;color:#164e3b">Suurenna kuva</button></div><div class="controls"><button id="prev" type="button">← Edellinen</button><div class="count" id="count" aria-live="polite"></div><button id="next" type="button">Seuraava →</button></div><p class="caption" id="caption"></p></main><footer>Ohje on tarkoitettu Ziiplyn mobiilitestaajille. Kuvia ei rajata.</footer><script>
const slides=[{"src":"/images/mobiiliohje/yläpalkki ja hahmot.png","title":"Kolme hahmoa – Gösta, Justiina ja Arvo","half":"left"},{"src":"/images/mobiiliohje/yläpalkki ja hahmot.png","title":"Yläpalkki ja alapalkki – navigointi","half":"right"},{"src":"/images/mobiiliohje/Yksi vai monta_ Kauppavertailun opas.png","title":"Kauppojen valinta"},{"src":"/images/mobiiliohje/ziiply_tarjoushaku_ohje_1.png","title":"Tarjousten katselu 1"},{"src":"/images/mobiiliohje/ziiply_tarjoushaku_ohje_2.png","title":"Tarjousten katselu 2"},{"src":"/images/mobiiliohje/Ostoskorin rakentaminen kotona ja kaupassa.png","title":"Ostoskorin rakentaminen"},{"src":"/images/mobiiliohje/ziiply_vertailu_dia_1.png","title":"Hintavertailu 1"},{"src":"/images/mobiiliohje/ziiply_vertailu_dia_2.png","title":"Hintavertailu 2"},{"src":"/images/mobiiliohje/ohje_vihkonen.png","title":"Vihkonen ja ostelusvihko"},{"src":"/images/mobiiliohje/ohje_justiina.png","title":"Justiinan reseptit"},{"src":"/images/mobiiliohje/justiinan_ohje.png","title":"Justiinan ohje"},{"src":"/images/mobiiliohje/arvon_ravintoskanneri.png","title":"Arvon ravintoskanneri"},{"src":"/images/mobiiliohje/arvo_ohje.png","title":"Arvon asetukset ja seuranta"},{"src":"/images/mobiiliohje/gostan_tarjousvahti.png","title":"Göstan tarjousvahti – kirjoita tuote tai hakusana ja paina Tallenna. Vahdit säilyvät selaimessa; automaattiset ilmoitukset eivät ole vielä käytössä."}];let index=0;const picture=document.getElementById('picture'),jump=document.getElementById('jump');slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.title;jump.append(o)});function show(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];picture.src=encodeURI(s.src);picture.alt=s.title;document.getElementById('caption').textContent=s.title;document.getElementById('count').textContent=(index+1)+' / '+slides.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;jump.value=index;document.getElementById('viewer').classList.remove('zoom','split','right');if(s.half){document.getElementById('viewer').classList.add('split');if(s.half==='right')document.getElementById('viewer').classList.add('right');}document.getElementById('zoom').textContent='Suurenna kuva';}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);jump.onchange=()=>show(Number(jump.value));let startX=null;picture.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});picture.addEventListener('touchend',e=>{if(startX===null)return;const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>65)show(index+(d<0?1:-1));startX=null},{passive:true});document.getElementById('zoom').onclick=()=>{const z=document.getElementById('viewer').classList.toggle('zoom');document.getElementById('zoom').textContent=z?'Pienennä kuva':'Suurenna kuva'};picture.onclick=()=>document.getElementById('zoom').click();show(0);
</script></body></html>
